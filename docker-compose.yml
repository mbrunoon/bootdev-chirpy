services:
  db:
    image: postgres:18
    container_name: chirpy
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chirpy_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chirpy_network

volumes:
  postgres_data:

networks:
  chirpy_network:
    driver: bridge